<svg width="640" height="581" viewBox="0 0 640 581" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Downloader CLI tool</title>
<desc>A standalone executable, built alongside the visualizer, that shells out to bundled yt-dlp and ffmpeg binaries to extract an MP3 from a YouTube URL directly into the song/ folder.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="581" fill="#ffffff"/>
<rect x="160.0" y="30" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="320.0" y="51.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0C447C">downloader main(argv)</text>
<text x="320.0" y="69.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#185FA5">separate executable from visualizer</text>
<line x1="320" y1="86" x2="320" y2="111" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<polygon points="320,111.0 420.0,146 320,181.0 220.0,146" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="320" y="146" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#633806">-help flag?</text>
<polyline points="420,146 470,146" fill="none" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="470" y="121" width="160" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="550.0" y="139.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#712B13">print usage</text>
<text x="550.0" y="157.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#993C1D">exit 0</text>
<text x="385" y="130" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#993C1D">yes</text>
<line x1="320" y1="181" x2="320" y2="191" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="336" y="166" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0F6E56">no</text>
<rect x="160.0" y="191" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="212.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Parse -add URL [-n name]</text>
<text x="320.0" y="230.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">customName defaults to yt-dlp's %(title)s</text>
<line x1="320" y1="247" x2="320" y2="287" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="287" width="320" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="316.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Build shell command</text>
<text x="320.0" y="334.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">yt-dlp -x --audio-format mp3 --ffmpeg-location ... url</text>
<line x1="320" y1="359" x2="320" y2="399" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="399" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="420.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">popen() executes command</text>
<text x="320.0" y="438.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">reads yt-dlp/ffmpeg stdout line by line</text>
<line x1="320" y1="455" x2="320" y2="495" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="495" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="320.0" y="516.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#26215C">MP3 saved to song/</text>
<text x="320.0" y="534.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#534AB7">picked up by Song's directory scan on next run</text>
</svg>