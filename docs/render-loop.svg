<svg width="640" height="768" viewBox="0 0 640 768" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Per-frame render loop</title>
<desc>Each frame: poll input, refresh the FFT from the audio thread's current playback position, clear and resize the projection, draw one bar per FFT bin with smoothing, build the ImGui control panel, then present.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="768" fill="#ffffff"/>
<rect x="160.0" y="30" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="320.0" y="51.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0C447C">window.processInput()</text>
<text x="320.0" y="69.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#185FA5">check ESC to close</text>
<line x1="320" y1="86" x2="320" y2="126" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="126" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="147.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">audio.Update()</text>
<text x="320.0" y="165.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">recompute FFT window, see diagram 2</text>
<line x1="320" y1="182" x2="320" y2="222" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="222" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="243.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">window.startFrame()</text>
<text x="320.0" y="261.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">clear color buffer</text>
<line x1="320" y1="278" x2="320" y2="318" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="318" width="320" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="347.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Build projection matrix</text>
<text x="320.0" y="365.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">ortho(0, width, 0, height) - resizes with window</text>
<line x1="320" y1="390" x2="320" y2="430" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="430" width="320" height="86" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="466.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">For each FFT bin -> bar</text>
<text x="320.0" y="484.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">log-scale + exponential smoothing, clamp, draw</text>
<line x1="320" y1="516" x2="320" y2="556" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="556" width="320" height="86" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="592.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">ImGui panel</text>
<text x="320.0" y="610.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">color/sensitivity/smoothing/volume sliders, etc.</text>
<line x1="320" y1="642" x2="320" y2="682" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="682" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="320.0" y="703.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#26215C">window.endFrame()</text>
<text x="320.0" y="721.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#534AB7">swap buffers + poll events</text>
<polyline points="480.0,710 580,710 580,58 480.0,58" fill="none" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="572" y="384.0" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6a64">next frame</text>
</svg>