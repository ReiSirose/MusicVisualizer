<svg width="640" height="708" viewBox="0 0 640 708" xmlns="http://www.w3.org/2000/svg" role="img">
<title>High-level startup and shutdown flow</title>
<desc>main() constructs Audio, Window, Shader, Geometry, Song and ImGui in order, runs the render loop until the window closes, then tears everything down.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="708" fill="#ffffff"/>
<rect x="160.0" y="30" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="320.0" y="51.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0C447C">main()</text>
<text x="320.0" y="69.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#185FA5">construct Audio, Window, Shader, Song</text>
<line x1="320" y1="86" x2="320" y2="126" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="126" width="320" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="155.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Audio ctor</text>
<text x="320.0" y="173.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">decode file (miniaudio), alloc KissFFT, start device</text>
<line x1="320" y1="198" x2="320" y2="238" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="238" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="259.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Window ctor</text>
<text x="320.0" y="277.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">GLFW init, create context, GLAD load</text>
<line x1="320" y1="294" x2="320" y2="334" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="334" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="355.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Shader ctor + Geometry ctor</text>
<text x="320.0" y="373.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">compile bar.vert/bar.frag, upload quad VBO/VAO</text>
<line x1="320" y1="390" x2="320" y2="430" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="430" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="451.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">ImGui init</text>
<text x="320.0" y="469.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">CreateContext, GLFW + OpenGL3 backends</text>
<line x1="320" y1="486" x2="320" y2="526" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="526" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="320.0" y="547.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#085041">Main render loop</text>
<text x="320.0" y="565.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0F6E56">while !shouldClose() - see diagrams 3 + 5</text>
<line x1="320" y1="582" x2="320" y2="622" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="622" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="320.0" y="643.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#26215C">Shutdown</text>
<text x="320.0" y="661.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#534AB7">ImGui destroy, device uninit, window/GLFW terminate</text>
</svg>