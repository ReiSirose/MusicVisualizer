<svg width="640" height="530" viewBox="0 0 640 530" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Per-frame sequence across objects</title>
<desc>Each frame the main loop polls Window for input, asks Audio to refresh the FFT, sets the shared projection matrix once, then for every FFT bin sets a per-bar model matrix on Shader and issues a draw call through Geometry, before building the ImGui panel and presenting.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="530" fill="#ffffff"/>
<line x1="60" y1="60" x2="60" y2="500" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="190" y1="60" x2="190" y2="500" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="320" y1="60" x2="320" y2="500" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="450" y1="60" x2="450" y2="500" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="570" y1="60" x2="570" y2="500" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<text x="125.0" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">processInput()</text>
<line x1="60" y1="100" x2="190" y2="100" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="190.0" y="134" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">Update()</text>
<line x1="60" y1="140" x2="320" y2="140" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="125.0" y="174" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">startFrame()</text>
<line x1="60" y1="180" x2="190" y2="180" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="255.0" y="214" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">use() + setMat4(projection)</text>
<line x1="60" y1="220" x2="450" y2="220" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="30" y="245" width="580" height="110" fill="none" stroke="#8a8880" stroke-width="1" stroke-dasharray="2 2"/><path d="M30 245 L100 245 L88 261 L30 261 Z" fill="#F1EFE8" stroke="#8a8880" stroke-width="1"/><text x="38" y="256" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">loop: for each FFT bin</text>
<text x="255.0" y="279" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">setMat4(model)</text>
<line x1="60" y1="285" x2="450" y2="285" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="315.0" y="321" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">draw()</text>
<line x1="60" y1="327" x2="570" y2="327" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="90.0" y="382" width="280" height="24" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/><text x="230" y="395" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#633806">build ImGui panel (sliders, buttons)</text>
<text x="125.0" y="434" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">endFrame()</text>
<line x1="60" y1="440" x2="190" y2="440" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="0.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="60" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">M</text>
<rect x="130.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="190" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">W</text>
<rect x="260.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="320" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">A</text>
<rect x="390.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="450" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">S</text>
<rect x="510.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="570" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">G</text>
</svg>