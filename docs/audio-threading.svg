<svg width="640" height="600" viewBox="0 0 640 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dual-thread audio pipeline</title>
<desc>The miniaudio callback thread drains decoded PCM into the output device and advances an atomic playback index independently of frame rate; the main thread reads that index once per frame, runs the FFT window, and writes magnitudes back under a mutex for the render loop to read.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="600" fill="#ffffff"/>
<line x1="110" y1="60" x2="110" y2="570" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="320" y1="60" x2="320" y2="570" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="530" y1="60" x2="530" y2="570" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="20" y="95" width="600" height="155" fill="none" stroke="#8a8880" stroke-width="1" stroke-dasharray="2 2"/><path d="M20 95 L90 95 L78 111 L20 111 Z" fill="#F1EFE8" stroke="#8a8880" stroke-width="1"/><text x="28" y="106" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">miniaudio callback thread (real-time, fixed period)</text>
<text x="215.0" y="131" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">read m_pcmData[index .. index+N]</text>
<line x1="110" y1="137" x2="320" y2="137" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="215.0" y="171" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">samples -> device output buffer</text>
<line x1="320" y1="177" x2="110" y2="177" stroke="#3d3d3a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="70.0" y="206" width="300" height="24" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/><text x="220" y="219" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#633806">m_playbackSampleIndex += N (atomic, lock-free)</text>
<rect x="20" y="290" width="600" height="250" fill="none" stroke="#8a8880" stroke-width="1" stroke-dasharray="2 2"/><path d="M20 290 L90 290 L78 306 L20 306 Z" fill="#F1EFE8" stroke="#8a8880" stroke-width="1"/><text x="28" y="301" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">main thread: Audio::Update() (once per frame)</text>
<text x="425.0" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">load m_playbackSampleIndex (atomic)</text>
<line x1="530" y1="332" x2="320" y2="332" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="175.0" y="361" width="230" height="24" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/><text x="290" y="374" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#633806">copy NFFT-window PCM into m_fftIn</text>
<rect x="175.0" y="403" width="230" height="24" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/><text x="290" y="416" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#633806">kiss_fftr(m_cfg, m_fftIn, m_fftOut)</text>
<text x="425.0" y="456" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">lock m_mutex</text>
<line x1="530" y1="462" x2="320" y2="462" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="165.0" y="489" width="250" height="24" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/><text x="290" y="502" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#633806">write magnitudes into m_frequencyOut</text>
<text x="425.0" y="536" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">unlock m_mutex</text>
<line x1="530" y1="542" x2="320" y2="542" stroke="#3d3d3a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="50.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="110" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">CB</text>
<rect x="260.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="320" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">Shared</text>
<rect x="470.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="530" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">Main</text>
</svg>